<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      try {
        var s = localStorage.getItem('theme');
        if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>Page not found — Kiln &amp; Bean</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="main" class="section">
      <div class="container narrow">
        <p class="eyebrow">404</p>
        <h1>That page isn't on the menu.</h1>
        <p class="lede">The link may be old, or the address mistyped.</p>
        <p><a class="button button--primary" href="/">Back to the front</a></p>
      </div>
    </main>
  </body>
</html>
